name: Organize, Generate, and Build Exotic

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Organize loose files into Maven structure
        run: |
          set -e
          SRC="exotic/src/main/java/com/exotic/plugin"
          RES="exotic/src/main/resources"
          STRUCT="$RES/structures"
          mkdir -p "$SRC" "$RES" "$STRUCT"

          # Any .java file dropped anywhere outside the proper package path gets moved in.
          find . -name "*.java" -not -path "./$SRC/*" -not -path "./.git/*" | while read -r f; do
            echo "Moving $f -> $SRC/"
            mv -f "$f" "$SRC/"
          done

          # plugin.yml belongs in resources, not the module root.
          find . -maxdepth 3 -name "plugin.yml" -not -path "./$RES/*" -not -path "./.git/*" | while read -r f; do
            echo "Moving $f -> $RES/"
            mv -f "$f" "$RES/"
          done

          # Any loose .nbt structure files belong in resources/structures.
          find . -name "*.nbt" -not -path "./$STRUCT/*" -not -path "./.git/*" | while read -r f; do
            echo "Moving $f -> $STRUCT/"
            mv -f "$f" "$STRUCT/"
          done

          # pom.xml belongs at the exotic/ module root.
          find . -maxdepth 2 -name "pom.xml" -not -path "./exotic/pom.xml" -not -path "./.git/*" | while read -r f; do
            echo "Moving $f -> exotic/"
            mv -f "$f" "exotic/"
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate arena structure (if generator present)
        run: |
          if [ -f "generate_arena.py" ]; then
            echo "Running generate_arena.py..."
            python3 generate_arena.py
          else
            echo "No generate_arena.py found in repo root - skipping."
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build plugin jar
        working-directory: exotic
        run: mvn -B clean package

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: exotic-plugin
          path: exotic/target/*.jar
